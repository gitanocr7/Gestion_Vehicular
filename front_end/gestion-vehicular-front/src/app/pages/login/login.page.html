<ion-content class="ion-padding auth-content">
  <div class="auth-page">
    <a routerLink="/index" class="auth-back"><ion-icon name="arrow-back-outline"></ion-icon> Volver al inicio</a>

    <div class="auth-card">
      <div class="ion-text-center ion-margin-bottom">
        <ion-icon name="shield-checkmark-outline" class="auth-icon"></ion-icon>
        <h2>Control Operativo</h2>
        <p>Ingrese sus credenciales institucionales</p>
      </div>

      <!-- Identificador (RUT o Correo) -->
      <ion-item fill="solid" class="ion-margin-bottom">
        <ion-input label="RUT o Correo Electrónico" labelPlacement="floating" [(ngModel)]="credentials.identificador" type="text" placeholder="ej: usuario@cuerpo.cl o 12345678-9"></ion-input>
      </ion-item>

      <!-- Contraseña -->
      <ion-item fill="solid" class="ion-margin-bottom">
        <ion-input label="Contraseña" labelPlacement="floating" [(ngModel)]="credentials.password" type="password" placeholder="Ingrese su contraseña"></ion-input>
      </ion-item>

      <ion-text color="danger" *ngIf="errorMessage">
        <p class="ion-text-center">{{ errorMessage }}</p>
      </ion-text>

      <ion-button expand="block" color="danger" (click)="onLogin()" class="ion-margin-top">
        Iniciar Sesión
      </ion-button>

      <ion-button expand="block" fill="outline" color="danger" (click)="goToRegister()" class="ion-margin-top">
        Registrarse
      </ion-button>
    </div>
  </div>
</ion-content>
