<ion-content class="auth-content">
  <div class="auth-page">
    <div class="auth-card">
      <!-- Borde superior rojo -->
      <div class="card-top-border"></div>

      <a routerLink="/index" class="auth-back">
        <ion-icon name="arrow-back-outline"></ion-icon> Volver al inicio
      </a>

      <!-- Encabezado con Icono -->
      <div class="ion-text-center auth-header">
        <div class="icon-avatar">
          <ion-icon name="person-circle-outline"></ion-icon>
        </div>
        <h2>Acceso Restringido</h2>
        <p>Ingrese sus credenciales autorizadas del Cuerpo de Bomberos</p>
      </div>

      <!-- Formulario -->
      <div class="auth-form">
        <!-- Identificador (RUT o Correo) -->
        <div class="form-group">
          <label class="input-label">Nombre de usuario o Correo</label>
          <div class="custom-input-container">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input 
              type="text" 
              [(ngModel)]="credentials.identificador" 
              placeholder="ejemplo@bomberostalcahuano.cl o usuario"
              class="custom-input"
            />
          </div>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label class="input-label">Contraseña</label>
          <div class="custom-input-container">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input 
              type="password" 
              [(ngModel)]="credentials.password" 
              placeholder="••••••••"
              class="custom-input"
            />
          </div>
        </div>

        <!-- Opciones adicionales -->
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" /> Recordar mi cuenta
          </label>
          <a href="#" class="forgot-password" (click)="$event.preventDefault()">¿Olvidó su contraseña?</a>
        </div>

        <!-- Mensaje de error -->
        <ion-text color="danger" *ngIf="errorMessage">
          <p class="error-message ion-text-center">{{ errorMessage }}</p>
        </ion-text>

        <!-- Botones de Acción -->
        <ion-button expand="block" class="btn-primary" (click)="onLogin()">
          <ion-icon name="log-in-outline" slot="start"></ion-icon>
          Iniciar Sesión
        </ion-button>

        <ion-button expand="block" class="btn-secondary" color="medium" (click)="goToRegister()">
          <ion-icon name="arrow-back-outline" slot="start"></ion-icon>
          Volver al Inicio
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
