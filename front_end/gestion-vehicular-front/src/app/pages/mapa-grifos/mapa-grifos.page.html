<app-site-nav></app-site-nav>

<div class="page-title-bar">
  <h1><i class="fa-solid fa-map-location-dot"></i> Mapa y Grifos Bomberos</h1>
</div>

<ion-content [fullscreen]="true" class="ion-padding">

  <div class="info-banner">
    <ion-icon name="information-circle-outline" class="info-banner-icon"></ion-icon>
    <p class="page-subtitle">
      Visor oficial del Sistema de Información Geográfica (SIG) de Bomberos de Chile.
      Puedes interactuar directamente con el mapa a continuación.
    </p>
  </div>

  <!-- Contenedor del Visor SIG Bomberos de Chile -->
  <div class="iframe-container">
    <iframe 
      [src]="mapaBomberosUrl" 
      title="Mapa SIG Bomberos de Chile" 
      allow="geolocation" 
      allowfullscreen>
    </iframe>
  </div>

  <!-- Listado complementario de puntos (si tu backend posee datos) -->
  <div class="puntos-list" *ngIf="puntos.length > 0">
    <h3>Otros Puntos Registrados</h3>
    <div class="punto-item" *ngFor="let p of puntos">
      <ion-chip [color]="colorChip(p.tipo)">
        <ion-label>{{ etiquetaTipo(p.tipo) }}</ion-label>
      </ion-chip>
      <div>
        <h4>{{ p.nombre }}</h4>
        <p *ngIf="p.direccion">{{ p.direccion }}</p>
        <p *ngIf="p.descripcion" class="descripcion">{{ p.descripcion }}</p>
      </div>
    </div>
  </div>

</ion-content>
