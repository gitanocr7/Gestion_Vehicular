<ion-content class="auth-content">
  <div class="auth-page">
    <div class="auth-card">
      <!-- Borde superior rojo -->
      <div class="card-top-border"></div>

      <!-- Enlace para volver al inicio -->
      <a routerLink="/index" class="auth-back">
        <ion-icon name="arrow-back-outline"></ion-icon> Volver al inicio
      </a>

      <!-- Encabezado con Icono -->
      <div class="ion-text-center auth-header">
        <div class="icon-avatar">
          <ion-icon name="person-add-outline"></ion-icon>
        </div>
        <h2>Nuevo Usuario</h2>
        <p>Complete sus datos para registrarse</p>
      </div>

      <!-- Formulario -->
      <div class="auth-form">
        <!-- Nombre -->
        <div class="form-group">
          <label class="input-label">Nombre</label>
          <div class="custom-input-container">
            <ion-icon name="person-outline" class="input-icon"></ion-icon>
            <input 
              type="text" 
              [(ngModel)]="user.nombre" 
              (input)="validarNombre()"
              placeholder="Ingrese su nombre completo"
              class="custom-input"
            />
          </div>
          <ion-text color="danger" *ngIf="errors.nombre" class="error-msg">
            <small>{{ errors.nombre }}</small>
          </ion-text>
        </div>

        <!-- Correo Electrónico -->
        <div class="form-group">
          <label class="input-label">Correo Electrónico</label>
          <div class="custom-input-container">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input 
              type="email" 
              [(ngModel)]="user.correo" 
              (input)="validarCorreo()"
              placeholder="ejemplo@bomberostalcahuano.cl"
              class="custom-input"
            />
          </div>
          <ion-text color="danger" *ngIf="errors.correo" class="error-msg">
            <small>{{ errors.correo }}</small>
          </ion-text>
        </div>

        <!-- RUT -->
        <div class="form-group">
          <label class="input-label">RUT</label>
          <div class="custom-input-container">
            <ion-icon name="card-outline" class="input-icon"></ion-icon>
            <input 
              type="text" 
              [(ngModel)]="user.rut" 
              (input)="validarRut()"
              placeholder="ej: 12345678-9 o 12.345.678-K"
              class="custom-input"
            />
          </div>
          <ion-text color="danger" *ngIf="errors.rut" class="error-msg">
            <small>{{ errors.rut }}</small>
          </ion-text>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label class="input-label">Contraseña</label>
          <div class="custom-input-container">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input 
              type="password" 
              [(ngModel)]="user.password" 
              (input)="validarPassword()"
              placeholder="Cree una contraseña"
              class="custom-input"
            />
          </div>
          <ion-text color="danger" *ngIf="errors.password" class="error-msg">
            <small>{{ errors.password }}</small>
          </ion-text>
        </div>

        <!-- Botones de Acción -->
        <ion-button expand="block" class="btn-primary" (click)="onRegister()">
          <ion-icon name="person-add-outline" slot="start"></ion-icon>
          Registrarse
        </ion-button>

        <ion-button expand="block" class="btn-secondary" color="medium" routerLink="/login">
          <ion-icon name="log-in-outline" slot="start"></ion-icon>
          Volver al Login
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
